{% set name = "aws-c-common" %}
{% set version = "0.14.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/awslabs/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: f47dea1686742098db2ae5a9f7296af4fc8d27494dc80e03e4fa2fe802fa86ab
  patches:
    - 0001-Explicitly-remove-Werror.patch

build:
  number: 1
  run_exports:
    - {{ pin_subpackage("aws-c-common", max_pin="x.x.x") }}

requirements:
  build:
    - cmake !=3.19.0,!=3.19.1
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - ninja

test:
  requires:
    - {{ compiler('c') }}  # [target_platform == "win-arm64"]
    - cmake  # [target_platform == "win-arm64"]
  files:
    - CMakeLists.txt  # [target_platform == "win-arm64"]
    - consumer.c  # [target_platform == "win-arm64"]
  commands:
    - cmake -S . -B consumer-build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%LIBRARY_PREFIX%"  # [target_platform == "win-arm64"]
    - cmake --build consumer-build  # [target_platform == "win-arm64"]
    - consumer-build\aws_consumer.exe  # [target_platform == "win-arm64"]
    - dumpbin /headers "%LIBRARY_BIN%\aws-c-common.dll" | findstr /I /C:"AA64 machine (ARM64)"  # [target_platform == "win-arm64"]
    - dumpbin /headers consumer-build\aws_consumer.exe | findstr /I /C:"AA64 machine (ARM64)"  # [target_platform == "win-arm64"]
    - test -f $PREFIX/lib/libaws-c-common${SHLIB_EXT}  # [unix]
    - test -f $PREFIX/include/aws/common/config.h  # [unix]
    - test -f $PREFIX/lib/cmake/aws-c-common/modules/AwsCFlags.cmake  # [unix]
    # Check for the non-existence of -Werror in the CFLAGS
    - '! grep Werror $PREFIX/lib/cmake/AwsCFlags.cmake'  # [unix]
    - if not exist %PREFIX%\\Library\\bin\\aws-c-common.dll exit 1  # [win]
    - if not exist %PREFIX%\\Library\\include\\aws\\common\\config.h exit 1  # [win]
    - if not exist %PREFIX%\\Library\\lib\\cmake\\aws-c-common\\modules\\AwsCFlags.cmake exit 1  # [win]

about:
  home: https://github.com/awslabs/aws-c-common
  dev_url: https://github.com/awslabs/aws-c-common
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Core c99 package for AWS SDK for C. Includes cross-platform primitives, configuration, data structures, and error handling.

extra:
  recipe-maintainers:
    - xhochy
    - conda-forge/aws-sdk-cpp
